name: Release archives

on:
  pull_request:
  push:
    branches: [mega]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-archives-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive:
    name: ${{ matrix.product == 'ioi' && 'ioi-' || '' }}archive (${{ matrix.platform.name }}, ${{ matrix.flavor }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: linux-x64, runner: ubuntu-24.04, os: linux, arch: x64 }
          - { name: linux-arm64, runner: ubuntu-24.04-arm, os: linux, arch: arm64 }
          - { name: macos-arm64, runner: macos-latest, os: macos, arch: arm64 }
          - { name: windows-x64, runner: windows-latest, os: windows, arch: x64 }
          - { name: windows-arm64, runner: windows-11-arm, os: windows, arch: arm64 }
        flavor: [dart, llvm]
        product: [ciwapa, ioi]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned Dart version
        id: dart
        run: echo "version=$(.github/scripts/dart-version.sh)" >>"$GITHUB_OUTPUT"

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: ${{ steps.dart.outputs.version }}

      - name: Fetch the Dart SDK
        if: matrix.flavor == 'dart'
        run: .github/scripts/fetch-dart-sdk.sh ${{ matrix.platform.os }} ${{ matrix.platform.arch }} "$RUNNER_TEMP/toolchain"

      - name: Restore the Linux LLVM bundle
        if: matrix.flavor == 'llvm' && matrix.platform.os == 'linux'
        id: linux-bundle
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/toolchain
          key: llvm-linux-bundle-${{ matrix.platform.arch }}-${{ hashFiles('.github/toolchain.env', '.github/scripts/llvm-linux-bundle.sh') }}

      - name: Build the Linux LLVM bundle
        if: matrix.flavor == 'llvm' && matrix.platform.os == 'linux' && steps.linux-bundle.outputs.cache-hit != 'true'
        run: .github/scripts/llvm-linux-bundle.sh ${{ matrix.platform.arch }} "$RUNNER_TEMP/toolchain"

      - name: Fetch llvm-mingw
        if: matrix.flavor == 'llvm' && matrix.platform.os == 'windows'
        run: .github/scripts/fetch-llvm-mingw.sh ${{ matrix.platform.arch }} "$RUNNER_TEMP/toolchain"

      - name: Use Apple clang
        if: matrix.flavor == 'llvm' && matrix.platform.os == 'macos'
        run: mkdir -p "$RUNNER_TEMP/toolchain" && clang --version

      - name: Assemble the archive
        id: archive
        run: |
          archive="$(.github/scripts/assemble-archive.sh ${{ matrix.product }} ${{ matrix.platform.name }} ${{ matrix.flavor }} "$RUNNER_TEMP/toolchain" "$RUNNER_TEMP/archives")"
          name="$(basename "$archive")"
          name="${name%.zip}"
          # upload-artifact needs a Windows path there, not Git Bash's /d/a/...
          [[ "$RUNNER_OS" == Windows ]] && archive="$(cygpath -w "$archive")"
          echo "path=$archive" >>"$GITHUB_OUTPUT"
          echo "name=${name%.tar.xz}" >>"$GITHUB_OUTPUT"

      - name: Smoke test
        id: smoke
        run: |
          compiler="$(.github/scripts/smoke-test.sh "${{ steps.archive.outputs.path }}" ${{ matrix.flavor }} "$RUNNER_TEMP/smoke")"
          echo "compiler=$compiler" >>"$GITHUB_OUTPUT"

      # The IR cross-check: the full conformance suite through the toolchain the archive ships.
      - name: Conformance with the archived compiler
        if: matrix.flavor == 'llvm' && matrix.product == 'ciwapa'
        working-directory: packages/conformance
        run: dart --suppress-analytics run bin/conformance.dart --compiler "${{ steps.smoke.outputs.compiler }}"

      - name: Upload the archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.archive.outputs.name }}
          path: ${{ steps.archive.outputs.path }}
          if-no-files-found: error
          compression-level: 0

  # R14, Q179: the editors ship in the release with the compilers' version, after their smoke tests
  # pass against the server built from the same commit (Q168).
  vscode:
    name: vscode extension
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Read the version
        id: version
        run: |
          echo "version=$(sed -n 's/^version: *//p' packages/ciwapa_llvm/pubspec.yaml)" >>"$GITHUB_OUTPUT"
      - name: Build the language server
        run: |
          tools/in-docker dart --suppress-analytics pub get
          tools/in-docker dart --suppress-analytics compile exe packages/ciwapa_llvm/bin/ciwapa_llvm.dart -o .cache/build/ciwapa-llvm
      - name: Test, smoke test and build the .vsix
        working-directory: editors/vscode
        run: ../../tools/in-docker --image node sh -c 'npm ci --no-audit --no-fund && npm test && xvfb-run -a npm run smoke && npm run build'
      - name: Upload the .vsix
        uses: actions/upload-artifact@v7
        with:
          name: intercal-vscode-${{ steps.version.outputs.version }}
          path: editors/vscode/intercal-vscode-${{ steps.version.outputs.version }}.vsix
          if-no-files-found: error
          compression-level: 0

  jetbrains:
    name: jetbrains plugin
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            .cache/home/.gradle/caches
            .cache/home/.gradle/wrapper
            editors/jetbrains/.intellijPlatform
          key: jetbrains-release-${{ hashFiles('editors/jetbrains/*.gradle.kts', 'editors/jetbrains/gradle.properties', 'editors/jetbrains/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Read the version
        id: version
        run: |
          echo "version=$(sed -n 's/^version: *//p' packages/ciwapa_llvm/pubspec.yaml)" >>"$GITHUB_OUTPUT"
      - name: Build the language server
        run: |
          tools/in-docker dart --suppress-analytics pub get
          tools/in-docker dart --suppress-analytics compile exe packages/ciwapa_llvm/bin/ciwapa_llvm.dart -o .cache/build/ciwapa-llvm
      - name: Smoke test and build the plugin
        working-directory: editors/jetbrains
        run: ../../tools/in-docker --image jdk ./gradlew --console=plain test buildPlugin
      - name: Upload the plugin
        uses: actions/upload-artifact@v7
        with:
          name: intercal-jetbrains-${{ steps.version.outputs.version }}
          path: editors/jetbrains/build/distributions/intercal-jetbrains-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          compression-level: 0
